
<!DOCTYPE html>
<html lang="bn" style="min-height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="meta-theme-color" content="#f0f9ff">
    <title>সপ্তম শ্রেণীর গাইড - ব্লু এডিশন</title>
    <style>
        html, body {
            background-color: #f0f9ff;
        }
    </style>
    <script src="file:///android_asset/www/assets/tailwindcss.js"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                darkMode: 'class'
            };
        }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap">
    <style>
        @font-face {
            font-family: 'Kalpurush';
            src: url('file:///android_asset/font/Kalpurush.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-blue: #0284c7;
            --secondary-blue: #0369a1;
            --accent-cyan: #38bdf8;
            --card-surface: rgba(255, 255, 255, 0.85);
            --header-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 60%, #0c4a6e 100%);
            --header-dark-gradient: linear-gradient(135deg, #0b1329 0%, #0f172a 60%, #0369a1 100%);
            --nav-gradient: linear-gradient(135deg, #0c4a6e 0%, #075985 100%);
            --nav-dark-gradient: linear-gradient(135deg, #080d1a 0%, #0f172a 60%, #0284c7 100%);
        }

        html.dark {
            color-scheme: dark;
        }

        body {
            font-family: 'Kalpurush', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 35%, #bae6fd 70%, #7dd3fc 100%);
            color: #0c4a6e;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* Default Sky Theme */
        html.theme-sky body {
            background: #e0f2fe;
            color: #ffffff;
        }

        /* Light Theme (Full White with soft shaded bars) */
        html.theme-light body {
            background: #f1f5f9 !important;
            color: #0f172a !important;
        }

        /* Dark Theme (Full Dark) */
        html.theme-dark body,
        html.dark body {
            background: #070b14 !important;
            color: #f8fafc !important;
        }

        h1, h2, h3, h4, h5, .brand-font {
            font-family: 'Kalpurush', 'Noto Sans Bengali', sans-serif;
            letter-spacing: -0.01em;
        }

        /* Floating Header Styles */
        .floating-header {
            border-radius: 20px;
            z-index: 4000;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html.theme-sky .floating-header {
            background: rgba(15, 23, 42, 0.5) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        html.theme-light .floating-header {
            background: #f8fafc !important;
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.08) !important;
            border: 1.5px solid #cbd5e1 !important;
            color: #0f172a !important;
        }

        html.theme-dark .floating-header,
        html.dark .floating-header {
            background: var(--header-dark-gradient);
            box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #ffffff;
        }

        /* Solid Bottom Navigation Bar: strictly opaque so no underlying elements/subject names show through */
        .fixed-bottom-nav {
            border-radius: 28px;
            z-index: 4000;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        html.theme-sky .fixed-bottom-nav {
            background: rgba(15, 23, 42, 0.5) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5) !important;
        }

        html.theme-light .fixed-bottom-nav {
            background: #f8fafc !important;
            border: 1.5px solid #cbd5e1 !important;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.07) !important;
        }

        html.theme-dark .fixed-bottom-nav,
        html.dark .fixed-bottom-nav {
            background: #090d16 !important;
            border: 1px solid rgba(56, 189, 248, 0.35) !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.95) !important;
        }

        /* Glassmorphism Dynamic Subject Cards */
        .subject-card-v3 {
            position: relative;
            border-radius: 22px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px -4px rgba(3, 105, 161, 0.15), 0 3px 6px -1px rgba(3, 105, 161, 0.1);
        }

        .subject-card-v3::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 100%);
            pointer-events: none;
            border-radius: 22px 22px 0 0;
        }

        .subject-card-v3:active {
            transform: scale(0.95) translateY(2px) translateZ(0);
            -webkit-transform: scale(0.95) translateY(2px) translateZ(0);
            box-shadow: 0 4px 10px -2px rgba(3, 105, 161, 0.2);
        }

        html.dark .subject-card-v3,
        html.theme-dark .subject-card-v3 {
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 24px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.08);
        }

        html.dark .subject-card-v3::before,
        html.theme-dark .subject-card-v3::before {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
        }

        html.theme-light .subject-card-v3 {
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        html.dark .subject-card-v3:active {
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.8);
        }

        /* Banner Polish */
        .hero-banner {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0c4a6e 100%);
            border-radius: 24px;
            box-shadow: 0 12px 28px -6px rgba(2, 132, 199, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        html.dark .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 14px 32px -6px rgba(0, 0, 0, 0.7), 0 0 20px rgba(14, 165, 233, 0.18);
        }

        .drawer-card {
            border-radius: 0 28px 28px 0;
            overflow: hidden;
            box-shadow: 10px 0 45px rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(180deg, #0b1329 0%, #0f172a 100%);
        }

        html.theme-sky .drawer-card {
            background: linear-gradient(180deg, #0b1329 0%, #0c4a6e 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        html.theme-light .drawer-card {
            background: #ffffff !important;
            border-right: 1.5px solid #e2e8f0 !important;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.12) !important;
            color: #0f172a !important;
        }

        html.theme-dark .drawer-card,
        html.dark .drawer-card {
            background: #090d16 !important;
            border-right: 1px solid rgba(56, 189, 248, 0.25) !important;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.85) !important;
            color: #ffffff !important;
        }

        .icon-shadow {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
        }

        .icon-glow {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-glow::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130%;
            height: 130%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
        }

        html.dark .icon-glow::after {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
        }

        /* Ambient floating birds */
        .bird-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.25;
        }
        
        .bird {
            position: absolute;
            width: 40px;
            height: 40px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            animation: fly linear infinite;
        }
        body.loaded .bird {
            background-image: url('file:///android_asset/Image/sticker/bird.gif');
        }
        
        @keyframes fly {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(120vw); }
        }

        /* Shimmer animation */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite;
        }

        /* Pulse glow */
        @keyframes softPulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        .animate-soft-pulse {
            animation: softPulse 3s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 10px;
        }
        html.dark ::-webkit-scrollbar-thumb {
            background: #38bdf8;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

  }

</script>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => {
                document.body.classList.add('loaded');
            });
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
